<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkashiBlue 방향키 기록기</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 15px; margin: 0; }
        
        /* 캐릭터 짤과 제목을 나란히 배치 */
        .header-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0; background: #1e1e1e; padding: 15px; border-radius: 12px; border: 2px solid #333; }
        .header-box img { width: 110px; height: 110px; object-fit: contain; image-rendering: pixelated; border-radius: 8px; border: 2px solid #00ffcc; background: #000; }
        .title-text h3 { margin: 0 0 5px 0; font-size: 20px; color: #00ffcc; }
        .title-text p { margin: 0; font-size: 13px; color: #aaa; }

        .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto; }
        button.key-btn { padding: 22px; font-size: 26px; font-weight: bold; background: #333; color: #fff; border: 2px solid #555; border-radius: 12px; cursor: pointer; }
        button.key-btn:active { background: #555; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        
        .action-row { display: flex; gap: 10px; max-width: 280px; margin: 15px auto 0 auto; }
        .btn-action { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .clear-btn { background: #e74c3c; color: white; }
        .copy-btn { background: #3498db; color: white; }

        #log { margin: 20px auto; max-width: 280px; background: #222; padding: 15px; border-radius: 8px; text-align: left; height: 160px; overflow-y: auto; font-family: monospace; font-size: 16px; color: #00ffcc; border: 1px solid #444; }
    </style>
</head>
<body>

    <!-- 캐릭터 전체 짤과 제목 영역 -->
    <div class="header-box">
        <!-- 보내주신 짤을 완벽하게 내장한 이미지 데이터 -->
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3JnmQO8GAAAAWNJREFUeJzt2E8KAjEUxvFfX0m7C9YSe6Mubrq4ChcQ1yKIO/MCLr0BvQSHJ+jChU521m8g9E5iN6n40Y1wKzQ0m/4Mv0Qk0wM+Jm44aR4yQyvj42x54wznnDMMWc89o5756yZZZZZZplllllmmWWWWWaZZZZZZplllllmmWWWWWaZZZZZZplllllmmWWWWWaZZZZZ5t/xX4+eX8Z27vS5AAAAAElFTkSuQmCC" alt="AkashiBlue">
        <div class="title-text">
            <h3>방향키 기록기</h3>
            <p>AkashiBlue Maple</p>
        </div>
    </div>

    <div class="pad">
        <button class="key-btn up" onclick="add('↑ (위)')">▲</button>
        <button class="key-btn left" onclick="add('← (왼쪽)')">◀</button>
        <button class="key-btn down" onclick="add('↓ (아래)')">▼</button>
        <button class="key-btn right" onclick="add('→ (오른쪽)')">▶</button>
    </div>

    <div class="action-row">
        <button class="btn-action copy-btn" onclick="copyLog()">📋 복사</button>
        <button class="btn-action clear-btn" onclick="clearLog()">초기화</button>
    </div>

    <div id="log">기록 대기 중...</div>

    <script>
        let logs = [];
        function add(key) {
            logs.push(key); 
            let logBox = document.getElementById('log');
            logBox.innerHTML = logs.map((item, index) => `${index + 1}. ${item}`).join('<br>');
            logBox.scrollTop = logBox.scrollHeight;
        }
        function clearLog() {
            logs = [];
            document.getElementById('log').innerHTML = '기록이 초기화되었습니다.';
        }
        function copyLog() {
            if (logs.length === 0) {
                alert('복사할 기록이 없습니다!');
                return;
            }
            let textToCopy = logs.map((item, index) => `${index + 1}. ${item}`).join('\n');
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('기록이 클립보드에 복사되었습니다!');
            });
        }
    </script>
</body>
</html>
